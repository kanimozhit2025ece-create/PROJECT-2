<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Books – BookVerse</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-100 to-teal-200 min-h-screen p-6">

<!-- Navigation bar -->
<header class="flex justify-between items-center mb-6 bg-white p-3 rounded-lg shadow">
  <h1 class="text-xl font-bold text-green-700">📚 BookVerse</h1>
  <nav class="space-x-4">
    <a href="index...html" class="text-blue-700 hover:underline">Home</a>
    <a href="books.html" class="text-blue-700 hover:underline">Books</a>
    <a href="mybooks.html" class="text-green-800 font-bold underline">My Books</a>
  </nav>
</header>

<h2 class="text-2xl font-semibold text-gray-700 mb-4">📗 My Borrowed Books</h2>
<div id="myBooks" class="grid md:grid-cols-3 gap-4"></div>

<script>
  const borrowed = JSON.parse(localStorage.getItem("myBooks")) || [];
  const container = document.getElementById("myBooks");

  if (borrowed.length === 0) {
    container.innerHTML = "<p class='text-gray-600'>You haven’t borrowed any books yet.</p>";
  } else {
    borrowed.forEach(book => {
      const card = document.createElement("div");
      card.className = "bg-white p-4 rounded shadow hover:shadow-lg transition";
      card.innerHTML = `
        <h3 class="font-bold text-lg">${book.title}</h3>
        <p class="text-gray-600">${book.author}</p>
      `;
      container.appendChild(card);
    });
  }
</script>
</body>
</html>
